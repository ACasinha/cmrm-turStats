<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8B4A2B">
<link rel="icon" type="image/png" href="img/logo.png">
<title>VisitReguengos - Visualização de Dados</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style-admin.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">
      <img src="img/logo.png" alt="Logo Município">
    </div>
    <div class="login-titulo">VisitReguengosBI</div>
    <div class="login-sub">Plataforma de Visualização de Dados Turísticos</div>
    <div class="login-erro" id="loginErro"></div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginUser" placeholder="utilizador@exemplo.pt"
             autocomplete="username" inputmode="email"
             onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Password"
             autocomplete="current-password"
             onkeydown="if(event.key==='Enter')fazerLogin()">
    </div>
    <button class="btn-login" id="btnLogin" onclick="fazerLogin()">Entrar →</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo-circle">
      <img src="img/logo.png" alt="Logo Município">
    </div>
    <div class="header-text">
      <h1>VisitReguengosBI</h1>
    </div>
  </div>
  <div class="header-right">
    <div class="user-info">
      <span class="user-label">Funcionário(a)</span>
      <span class="user-name" id="headerNomeFuncionario">—</span>
      <button class="btn-logout" onclick="fazerLogout()">↩ Sair</button>
    </div>
  </div>
</div>

<!-- CONTEÚDO ADMIN -->
<div class="admin-container" id="adminContainer" style="display:none">
  
  <div class="admin-header">
    <h1>📊 VisitReguengosBI</h1>
    <p>Plataforma de Visualização de Dados Turísticos</p>
  </div>
  
  <div class="admin-actions">
    <button class="btn-novo-user btn-voltar" onclick="voltarParaApp()">
      ← Voltar à App
    </button>
  </div>
  
  <div class="users-table-container">

<iframe 
  width="100%" 
  height="849" 
  src="https://datastudio.google.com/embed/reporting/414152b5-cc80-40f9-9919-eb3e4ad01b60/page/p_66np6i8g3d?navState=isNavigationHidden%3Dtrue&config=%7B%22sn%22%3A%22false%22%7D" 
  frameborder="0" 
  style="border:0" 
  sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
</iframe>
    
  </div>
  
</div>



<!-- RODAPÉ -->
<footer class="rodape">
  <div class="rodape-logo">
    <img src="img/logo-turismo.png" alt="Serviços de Turismo">
  </div>
  <div class="rodape-texto">
    <span class="rodape-dev">Desenvolvido pelos Serviços de Turismo do Município de Reguengos de Monsaraz</span>
    <div class="rodape-pwa">
      <span class="rodape-versao" id="rodapeVersao">v1</span>
      <button class="btn-rodape" id="btnVerificarUpdate" onclick="verificarAtualizacao()" title="Verificar atualização">
        🔄 Verificar atualização
      </button>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Aplicação -->
<script src="js/api.js"></script>
<script src="js/sw-update.js"></script>
<script src="js/users.js"></script>


<script>
'use strict';

var modoEdicao = false;

// ============================================================
// LOGIN
// ============================================================

function fazerLogin() {
  var email = document.getElementById('loginUser').value.trim();
  var pass  = document.getElementById('loginPass').value;
  var erro  = document.getElementById('loginErro');
  var btn   = document.getElementById('btnLogin');

  if (!email || !pass) {
    erro.textContent = 'Por favor preencha todos os campos.';
    erro.classList.add('visivel');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'A autenticar...';
  erro.classList.remove('visivel');

  apiAutenticar(email, pass,
    function onSuccess(resp) {
      // Verificar se é admin
      verificarSeAdmin()
        .then(function(isAdmin) {
          if (!isAdmin) {
            btn.disabled = false;
            btn.textContent = 'Entrar →';
            erro.textContent = 'Acesso negado. Apenas administradores podem aceder a esta área.';
            erro.classList.add('visivel');
            apiLogout();
            return;
          }
          document.getElementById('loginOverlay').classList.add('hidden');
          document.getElementById('adminContainer').style.display = 'block';
          mostrarNomeUtilizador();
          carregarUtilizadores();
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Entrar →';
          erro.textContent = 'Erro ao verificar permissões: ' + err.message;
          erro.classList.add('visivel');
          apiLogout();
        });
    },
    function onFailure(err) {
      btn.disabled = false;
      btn.textContent = 'Entrar →';
      erro.textContent = err.message;
      erro.classList.add('visivel');
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
    }
  );
}

function fazerLogout() {
  if (!confirm('Deseja terminar a sessão?')) return;
  apiLogout().then(function() {
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('adminContainer').style.display = 'none';
    document.getElementById('loginPass').value = '';
  });
}

function voltarParaApp() {
  window.location.href = 'index.html';
}

// ============================================================
// NOME DO UTILIZADOR NO HEADER
// ============================================================
 
function mostrarNomeUtilizador() {
  obterPerfilUtilizador()
    .then(function(perfil) {
      var nome = perfil.nome || (firebaseAuth.currentUser && firebaseAuth.currentUser.email) || '—';
      document.getElementById('headerNomeFuncionario').textContent = nome;
    })
    .catch(function() {
      var user = firebaseAuth.currentUser;
      document.getElementById('headerNomeFuncionario').textContent = (user && user.email) || '—';
    });
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
  // Verificar se já está autenticado
  firebaseAuth.onAuthStateChanged(function(user) {
    if (user && sessaoValida()) {
      
      verificarSeAdmin()
        .then(function(isAdmin) {
          if (isAdmin) {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('adminContainer').style.display = 'block';
            mostrarNomeUtilizador();
            carregarUtilizadores();
          } else {
            apiLogout();
          }
        })
        .catch(function() {
          apiLogout();
        });
    }
  });
});
</script>

</body>
</html>
